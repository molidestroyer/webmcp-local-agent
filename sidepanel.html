<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebMCP Local Agent</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__row">
      <label class="sr-only" for="model-select">Ollama model</label>
      <select id="model-select" aria-label="Ollama model">
        <option value="">Loading models…</option>
      </select>
      <button id="refresh-models" class="icon-btn" type="button" title="Reload the list of Ollama models">
        <span aria-hidden="true">🔄</span>
        <span class="sr-only">Reload models</span>
      </button>
    </div>

    <div class="topbar__row topbar__row--meta">
      <button id="tools-badge" class="badge" type="button" title="Show the tools detected on the active tab">
        <span class="badge__dot" aria-hidden="true"></span>
        <span id="tools-badge-text">Detecting tools…</span>
      </button>
      <button id="refresh-tools" class="icon-btn icon-btn--sm" type="button" title="Re-inspect the active tab">
        <span aria-hidden="true">⟳</span>
        <span class="sr-only">Re-inspect the page</span>
      </button>
      <button id="clear-chat" class="icon-btn icon-btn--sm" type="button" title="Clear the conversation">
        <span aria-hidden="true">🗑</span>
        <span class="sr-only">Clear conversation</span>
      </button>
    </div>

    <div id="tools-list" class="tools-list" hidden></div>
    <div id="status" class="status" hidden></div>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <div class="empty">
      <h1>WebMCP Local Agent</h1>
      <p>
        Chat with <strong>Ollama</strong> running locally, and let it call the
        <strong>WebMCP</strong> tools exposed by the active tab.
      </p>
      <p class="empty__credits">
        Inspired by
        <a href="https://github.com/beaufortfrancois/model-context-tool-inspector" target="_blank" rel="noreferrer noopener">Model Context Tool Inspector</a>
        by François Beaufort and
        <a href="https://github.com/n4ze3m/page-assist" target="_blank" rel="noreferrer noopener">Page Assist</a>
        by n4ze3m.
      </p>
    </div>
  </main>

  <footer class="composer">
    <label class="toggle" title="Ask for confirmation before running each page tool">
      <input type="checkbox" id="confirm-tools">
      <span>Confirm every tool</span>
    </label>
    <div class="composer__row">
      <textarea id="input" rows="1" placeholder="Type a message… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button id="send" class="send-btn" type="button" disabled>
        <span aria-hidden="true">➤</span>
        <span class="sr-only">Send</span>
      </button>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
