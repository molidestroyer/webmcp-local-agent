<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebMCP Local Agent</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__row">
      <label class="sr-only" for="model-select">Modelo de Ollama</label>
      <select id="model-select" aria-label="Modelo de Ollama">
        <option value="">Cargando modelos…</option>
      </select>
      <button id="refresh-models" class="icon-btn" type="button" title="Recargar modelos de Ollama">
        <span aria-hidden="true">🔄</span>
        <span class="sr-only">Recargar modelos</span>
      </button>
    </div>

    <div class="topbar__row topbar__row--meta">
      <button id="tools-badge" class="badge" type="button" title="Ver herramientas detectadas en la pestaña activa">
        <span class="badge__dot" aria-hidden="true"></span>
        <span id="tools-badge-text">Detectando tools…</span>
      </button>
      <button id="refresh-tools" class="icon-btn icon-btn--sm" type="button" title="Volver a inspeccionar la pestaña activa">
        <span aria-hidden="true">⟳</span>
        <span class="sr-only">Reinspeccionar la página</span>
      </button>
      <button id="clear-chat" class="icon-btn icon-btn--sm" type="button" title="Vaciar la conversación">
        <span aria-hidden="true">🗑</span>
        <span class="sr-only">Vaciar conversación</span>
      </button>
    </div>

    <div id="tools-list" class="tools-list" hidden></div>
    <div id="status" class="status" hidden></div>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <div class="empty">
      <h1>WebMCP Local Agent</h1>
      <p>
        Chat con <strong>Ollama</strong> en local que puede llamar a las herramientas
        <strong>WebMCP</strong> que expone la pestaña activa.
      </p>
      <p class="empty__credits">
        Inspirado en
        <a href="https://github.com/beaufortfrancois/model-context-tool-inspector" target="_blank" rel="noreferrer noopener">Model Context Tool Inspector</a>
        de François Beaufort y en
        <a href="https://github.com/n4ze3m/page-assist" target="_blank" rel="noreferrer noopener">Page Assist</a>
        de n4ze3m.
      </p>
    </div>
  </main>

  <footer class="composer">
    <label class="toggle" title="Pedir confirmación antes de ejecutar cada herramienta de la página">
      <input type="checkbox" id="confirm-tools">
      <span>Confirmar cada tool</span>
    </label>
    <div class="composer__row">
      <textarea id="input" rows="1" placeholder="Escribe un mensaje… (Enter envía, Shift+Enter salta línea)"></textarea>
      <button id="send" class="send-btn" type="button" disabled>
        <span aria-hidden="true">➤</span>
        <span class="sr-only">Enviar</span>
      </button>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
