<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebMCP demo · todo list</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 20px; }
  code { font-family: ui-monospace, Consolas, monospace; background: rgba(127,127,127,.16); padding: 1px 5px; border-radius: 4px; }
  ul { padding-left: 20px; }
  li.done { text-decoration: line-through; opacity: .6; }
  .card { border: 1px solid rgba(127,127,127,.35); border-radius: 10px; padding: 14px 18px; margin-top: 18px; }
  .muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
  <h1>WebMCP demo · todo list</h1>
  <p class="muted">
    This page registers four tools on <code>navigator.modelContext</code>.
    Open the <strong>WebMCP Local Agent</strong> side panel and ask for things like
    "add buy bread", "mark #2 as done" or "what is still pending?".
  </p>

  <div class="card">
    <strong>Todos</strong>
    <ul id="list"></ul>
    <p class="muted" id="counter"></p>
  </div>

  <div class="card">
    <strong>Page theme</strong>
    <p class="muted">The agent can switch it with the <code>set-theme</code> tool.</p>
  </div>

<script>
// --- Page state ------------------------------------------------------------
const todos = [
  { id: 1, text: 'Try WebMCP with Ollama', done: false },
  { id: 2, text: 'Write the README', done: true },
];
let nextId = 3;

function render() {
  const list = document.getElementById('list');
  list.textContent = '';
  for (const todo of todos) {
    const li = document.createElement('li');
    li.textContent = '#' + todo.id + ' · ' + todo.text;
    if (todo.done) li.className = 'done';
    list.appendChild(li);
  }
  const pending = todos.filter((t) => !t.done).length;
  document.getElementById('counter').textContent = pending + ' pending of ' + todos.length;
}
render();

// --- Minimal WebMCP polyfill for browsers without the native API -----------
if (!('modelContext' in navigator)) {
  const registered = [];
  navigator.modelContext = {
    get tools() { return registered.slice(); },
    provideContext(config) {
      registered.length = 0;
      if (config && Array.isArray(config.tools)) registered.push(...config.tools);
    },
    registerTool(tool) { registered.push(tool); },
    unregisterTool(name) {
      const index = registered.findIndex((tool) => tool.name === name);
      if (index >= 0) registered.splice(index, 1);
    },
    async callTool(name, args) {
      const tool = registered.find((entry) => entry.name === name);
      if (!tool) throw new Error('Unknown tool: ' + name);
      return tool.execute(args);
    },
  };
}

const text = (value) => ({ content: [{ type: 'text', text: value }] });

// --- Tools -----------------------------------------------------------------
navigator.modelContext.provideContext({
  tools: [
    {
      name: 'list-todos',
      description: 'Returns every todo in the list with its id and status.',
      inputSchema: { type: 'object', properties: {}, required: [] },
      async execute() {
        if (!todos.length) return text('The list is empty.');
        return text(todos.map((t) => '#' + t.id + ' [' + (t.done ? 'done' : 'pending') + '] ' + t.text).join('\n'));
      },
    },
    {
      name: 'add-todo',
      description: 'Adds a new todo to the list.',
      inputSchema: {
        type: 'object',
        properties: { text: { type: 'string', description: 'Text of the todo' } },
        required: ['text'],
      },
      async execute({ text: value }) {
        if (!value) throw new Error('The todo text is missing.');
        const todo = { id: nextId++, text: String(value), done: false };
        todos.push(todo);
        render();
        return text('Todo #' + todo.id + ' added: ' + todo.text);
      },
    },
    {
      name: 'complete-todo',
      description: 'Marks a todo as completed, given its id.',
      inputSchema: {
        type: 'object',
        properties: { id: { type: 'number', description: 'Id of the todo' } },
        required: ['id'],
      },
      async execute({ id }) {
        const todo = todos.find((entry) => entry.id === Number(id));
        if (!todo) throw new Error('There is no todo #' + id);
        todo.done = true;
        render();
        return text('Todo #' + todo.id + ' marked as done.');
      },
    },
    {
      name: 'set-theme',
      description: 'Switches the page theme between light and dark.',
      inputSchema: {
        type: 'object',
        properties: { theme: { type: 'string', enum: ['light', 'dark'] } },
        required: ['theme'],
      },
      async execute({ theme }) {
        const dark = String(theme).toLowerCase() === 'dark';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.body.style.background = dark ? '#111318' : '#ffffff';
        document.body.style.color = dark ? '#e7e9ee' : '#16181d';
        return text('Theme switched to ' + (dark ? 'dark' : 'light') + '.');
      },
    },
  ],
});
</script>
</body>
</html>
