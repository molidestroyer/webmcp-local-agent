name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read manifest version
        id: meta
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="${{ steps.meta.outputs.version }}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match manifest.json ($manifest)."
            exit 1
          fi

      - name: Unit tests
        run: node --test

      # build.ps1 is the single packaging path: local and CI run the same script.
      - name: Package
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: webmcp-local-agent-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --clobber \
            --notes "Download the zip, unzip it and load it on \`chrome://extensions\` with **Load unpacked** (Developer mode required). You need [Ollama](https://ollama.com) running locally with a model that supports \`tools\`, and \`OLLAMA_ORIGINS=chrome-extension://*\` set — see the README."
