name: pages

# Publishes demo/ as the playground at
# https://molidestroyer.github.io/webmcp-local-agent/
#
# demo/ is the single source: the same files ship inside the extension zip, so
# the hosted playground and the bundled demos can never drift apart.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the landing page exists
        run: test -f demo/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - id: deployment
        uses: actions/deploy-pages@v4
